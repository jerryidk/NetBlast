<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="Helvetica,Arial,sans-serif">
<rect width="860" height="470" fill="#fbfaf7"/>
<text x="78" y="26" font-size="16" font-weight="600" fill="#1a1a1a">Is the DRAM ceiling a ceiling, or still climbing?</text>
<text x="78" y="45" font-size="11.5" fill="#5a5a5a">achieved bandwidth vs thread count, one thread per physical core</text>
<line x1="78" y1="402.0" x2="610.0" y2="402.0" stroke="#e0ddd6"/>
<text x="70" y="405.5" font-size="10.5" text-anchor="end" fill="#5a5a5a">0</text>
<line x1="78" y1="350.2" x2="610.0" y2="350.2" stroke="#e0ddd6"/>
<text x="70" y="353.7" font-size="10.5" text-anchor="end" fill="#5a5a5a">50</text>
<line x1="78" y1="298.3" x2="610.0" y2="298.3" stroke="#e0ddd6"/>
<text x="70" y="301.8" font-size="10.5" text-anchor="end" fill="#5a5a5a">100</text>
<line x1="78" y1="246.5" x2="610.0" y2="246.5" stroke="#e0ddd6"/>
<text x="70" y="250.0" font-size="10.5" text-anchor="end" fill="#5a5a5a">150</text>
<line x1="78" y1="194.6" x2="610.0" y2="194.6" stroke="#e0ddd6"/>
<text x="70" y="198.1" font-size="10.5" text-anchor="end" fill="#5a5a5a">200</text>
<line x1="78" y1="142.8" x2="610.0" y2="142.8" stroke="#e0ddd6"/>
<text x="70" y="146.3" font-size="10.5" text-anchor="end" fill="#5a5a5a">250</text>
<line x1="78" y1="90.9" x2="610.0" y2="90.9" stroke="#e0ddd6"/>
<text x="70" y="94.4" font-size="10.5" text-anchor="end" fill="#5a5a5a">300</text>
<line x1="78" y1="83.5" x2="610.0" y2="83.5" stroke="#9a9a9a" stroke-dasharray="5,4"/>
<text x="78.0" y="420" font-size="10.5" text-anchor="middle" fill="#5a5a5a">1</text>
<text x="184.4" y="420" font-size="10.5" text-anchor="middle" fill="#5a5a5a">2</text>
<text x="290.8" y="420" font-size="10.5" text-anchor="middle" fill="#5a5a5a">4</text>
<text x="397.2" y="420" font-size="10.5" text-anchor="middle" fill="#5a5a5a">8</text>
<text x="503.6" y="420" font-size="10.5" text-anchor="middle" fill="#5a5a5a">16</text>
<text x="610.0" y="420" font-size="10.5" text-anchor="middle" fill="#5a5a5a">24</text>
<text x="344.0" y="442" font-size="11.5" text-anchor="middle" fill="#1a1a1a">threads (= physical cores)</text>
<text transform="translate(20,230.0) rotate(-90)" font-size="11.5" text-anchor="middle" fill="#1a1a1a">GB/s</text>
<path d="M78.0,373.4 L184.4,344.7 L290.8,300.7 L397.2,255.9 L503.6,218.3 L610.0,211.0" fill="none" stroke="#12707f" stroke-width="2.2"/>
<circle cx="78.0" cy="373.4" r="3.4" fill="#12707f"/>
<circle cx="184.4" cy="344.7" r="3.4" fill="#12707f"/>
<circle cx="290.8" cy="300.7" r="3.4" fill="#12707f"/>
<circle cx="397.2" cy="255.9" r="3.4" fill="#12707f"/>
<circle cx="503.6" cy="218.3" r="3.4" fill="#12707f"/>
<circle cx="610.0" cy="211.0" r="3.4" fill="#12707f"/>
<path d="M78.0,385.5 L184.4,369.0 L290.8,337.5 L397.2,282.5 L503.6,199.1 L610.0,165.3" fill="none" stroke="#bb551c" stroke-width="2.2"/>
<circle cx="78.0" cy="385.5" r="3.4" fill="#bb551c"/>
<circle cx="184.4" cy="369.0" r="3.4" fill="#bb551c"/>
<circle cx="290.8" cy="337.5" r="3.4" fill="#bb551c"/>
<circle cx="397.2" cy="282.5" r="3.4" fill="#bb551c"/>
<circle cx="503.6" cy="199.1" r="3.4" fill="#bb551c"/>
<circle cx="610.0" cy="165.3" r="3.4" fill="#bb551c"/>
<text x="632" y="66" font-size="11" font-weight="600" fill="#1a1a1a">Arms</text>
<line x1="632" y1="82" x2="654" y2="82" stroke="#12707f" stroke-width="2.2"/>
<circle cx="643" cy="82" r="3.4" fill="#12707f"/>
<text x="662" y="86" font-size="10.5" fill="#5a5a5a">mixed read+write (the</text>
<text x="662" y="99" font-size="10.5" fill="#5a5a5a">denominator)</text>
<line x1="632" y1="118" x2="654" y2="118" stroke="#bb551c" stroke-width="2.2"/>
<circle cx="643" cy="118" r="3.4" fill="#bb551c"/>
<text x="662" y="122" font-size="10.5" fill="#5a5a5a">read-only</text>
<line x1="632" y1="141" x2="654" y2="141" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="5,4"/>
<text x="662" y="145" font-size="10.5" fill="#5a5a5a">nominal 8-channel peak,</text>
<text x="662" y="158" font-size="10.5" fill="#5a5a5a">307.2 GB/s</text>
<text x="632" y="185" font-size="10" fill="#1a1a1a">plateaued (+4.0% over the</text>
<text x="632" y="197" font-size="10" fill="#1a1a1a">last step): a ceiling</text>
</svg>
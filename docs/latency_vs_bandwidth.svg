<text x="88" y="411" font-size="10" fill="#5a5a5a">mean data-read latency</text>
<rect x="274" y="402" width="10" height="10" fill="#12707f"/>
<text x="288" y="411" font-size="10" fill="#5a5a5a">DRAM bandwidth used</text>
<rect x="474" y="402" width="10" height="10" fill="#bb551c"/>
<text x="488" y="411" font-size="10" fill="#5a5a5a">misses in flight (x10)</text>
<text x="74" y="470" font-size="10" fill="#5a5a5a">Ceiling = 184.2 GB/s, measured (dram_ceiling.sh). Latency is Little's law over OFFCORE_REQUESTS[_OUTSTANDING].DATA_RD.</text>
<text x="74" y="486" font-size="10" fill="#5a5a5a">Misses in flight scaled x10 to share the right axis; it falls 2.3 -&gt; 1.3 while latency rises.</text>
</svg>
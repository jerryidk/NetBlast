<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" font-family="Inter,Helvetica,Arial,sans-serif">
<rect width="760" height="500" fill="#fbfaf7"/>
<text x="74" y="26" font-size="15" font-weight="600" fill="#1a1a1a">Latency, not bandwidth</text>
<text x="74" y="44" font-size="12" fill="#5a5a5a">one access costs 9.3x more at 23 workers; the memory system is never above 8% of its ceiling</text>
<line x1="74" y1="350.0" x2="686" y2="350.0" stroke="#e0ddd6"/>
<text x="66" y="353.0" font-size="10" text-anchor="end" fill="#5a5a5a">0</text>

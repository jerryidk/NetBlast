<text x="66" y="280.0" font-size="10" text-anchor="end" fill="#5a5a5a">200</text>
<line x1="74" y1="204.0" x2="686" y2="204.0" stroke="#e0ddd6"/>
<text x="66" y="207.0" font-size="10" text-anchor="end" fill="#5a5a5a">400</text>
<line x1="74" y1="131.0" x2="686" y2="131.0" stroke="#e0ddd6"/>
<text x="66" y="134.0" font-size="10" text-anchor="end" fill="#5a5a5a">600</text>
<line x1="74" y1="58.0" x2="686" y2="58.0" stroke="#e0ddd6"/>
<text x="66" y="61.0" font-size="10" text-anchor="end" fill="#5a5a5a">800</text>
<text transform="translate(20,204) rotate(-90)" x="0" y="0" font-size="11" fill="#a8324a" text-anchor="middle">cycles per data read</text>
<text x="694" y="353.0" font-size="10" fill="#12707f">0%</text>
<text x="694" y="280.0" font-size="10" fill="#12707f">25%</text>
<text x="694" y="207.0" font-size="10" fill="#12707f">50%</text>
<text x="694" y="134.0" font-size="10" fill="#12707f">75%</text>
<text x="694" y="61.0" font-size="10" fill="#12707f">100%</text>
<text transform="translate(738,204) rotate(-90)" x="0" y="0" font-size="11" fill="#12707f" text-anchor="middle">% of DRAM ceiling</text>
<text x="135.2" y="368" font-size="10" text-anchor="middle" fill="#5a5a5a">1</text>
<text x="257.6" y="368" font-size="10" text-anchor="middle" fill="#5a5a5a">4</text>

<text x="680" y="321" font-size="10.5" fill="#1a1a1a">the rig: -m none, q=1,</text>
<text x="680" y="334" font-size="10.5" fill="#1a1a1a">burst 64</text>
<text x="650" y="363" font-size="10" fill="#1a1a1a">At burst 64 the bracket is</text>
<text x="650" y="375" font-size="10" fill="#1a1a1a">3.5 to 25.5. The rig's 5 is</text>
<text x="650" y="388" font-size="10" fill="#1a1a1a">inside it, above the</text>
<text x="650" y="400" font-size="10" fill="#1a1a1a">issue-limited floor and far</text>
<text x="650" y="413" font-size="10" fill="#1a1a1a">below a cache miss.</text>
